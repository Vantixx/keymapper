name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Proper Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/keymapper
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/example/keymapper/
          [ -f key.kt ] && mv key.kt app/src/main/java/com/example/keymapper/
          
          cat << 'EOF' > settings.gradle
          rootProject.name = "Keymapper"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace 'com.example.keymapper'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.keymapper"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keymapper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
