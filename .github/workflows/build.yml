name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android Project Files
        run: |
          mkdir -p app/src/main/java/com/example/keymapper
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/example/keymapper/
          [ -f key.kt ] && mv key.kt app/src/main/java/com/example/keymapper/
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "Keymapper"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          android {
              namespace 'com.example.keymapper'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.keymapper"
                  minSdk 24
                  targetSdk 34
              }
          }
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: |
          export ANDROID_HOME=$ANDROID_HOME
          # تنزيل حزم الأداة اللازمة للبناء بشكل مباشر وصحيح
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keymapper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
