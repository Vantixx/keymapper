name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/example/keymapper
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.kt app/src/main/java/com/example/keymapper/
          mv key.kt app/src/main/java/com/example/keymapper/
